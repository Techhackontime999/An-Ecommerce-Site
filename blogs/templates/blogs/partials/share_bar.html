<div class="blog-share-bar">
  <span class="blog-share-label"><i class="fas fa-share-alt"></i> Share</span>
  <button type="button" class="blog-share-btn" data-copy="{{ share_url }}" title="Copy link"><i class="fas fa-link"></i><span>Copy</span></button>
  <a class="blog-share-btn" href="{{ share_whatsapp }}" target="_blank" rel="noopener" title="Share on WhatsApp"><i class="fab fa-whatsapp"></i><span>WhatsApp</span></a>
  <a class="blog-share-btn" href="{{ share_x }}" target="_blank" rel="noopener" title="Share on X"><i class="fab fa-x-twitter"></i><span>X</span></a>
</div>

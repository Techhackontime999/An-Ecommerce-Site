<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ subject }}</title>
  <style>
    body { margin:0; padding:0; background-color:#f6f7f9; font-family:Arial,Helvetica,sans-serif; }
    a { color:#F97316; }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f6f7f9;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f6f7f9;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background-color:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e9ebf0;">
          <tr>
            <td style="padding:28px 32px 8px;" align="center">
              <div style="display:inline-flex;align-items:center;gap:8px;">
                <span style="width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#F97316,#FB923C);color:#ffffff;font-weight:800;font-size:20px;display:inline-flex;align-items:center;justify-content:center;">S</span>
                <span style="font-size:22px;font-weight:800;color:#0F172A;">Shop-Seed</span>
              </div>
            </td>
          </tr>
          {% block email_body %}{% endblock %}
          <tr>
            <td style="padding:16px 32px;background:#0F172A;" align="center">
              <p style="margin:0;font-size:12px;color:#94A3B8;">
                &copy; {{ site_name }}. Need help? Visit our
                <a href="{{ site_url }}/faq/" style="color:#FB923C;">FAQ</a> or
                <a href="{{ site_url }}/contact/" style="color:#FB923C;">contact support</a>.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>

# =============================================================================
# Render Blueprint — One-click deploy configuration
# =============================================================================
# 1. Push this repo to GitHub
# 2. Go to https://dashboard.render.com/blueprints
# 3. Connect your repo — Render auto-detects this file
# 4. Set the missing SECRET_KEY, RAZORPAY_*, and SUPERUSER vars manually
# =============================================================================
databases:
  - name: ecommerce-db
    plan: free
    region: singapore
    databaseName: ecommerce
    user: ecommerce_user

services:
  - type: web
    name: ecommerce-site
    plan: free
    region: singapore
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers=3 --access-logfile=-
    preDeployCommand: bash setup.sh
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

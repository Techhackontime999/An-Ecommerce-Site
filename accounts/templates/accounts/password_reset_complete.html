{% extends "shop/base/base.html" %}
{% load static %}

{% block title %}Password Reset Complete — Shop-Seed{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-glow auth-glow-a"></div>
  <div class="auth-glow auth-glow-b"></div>
  <div class="auth-glow auth-glow-c"></div>

  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-logo"><i class="fas fa-store"></i></span>
      <span class="auth-brand-name">Shop-Seed</span>
    </div>

    <div class="auth-success-icon auth-success-icon-green">
      <i class="fas fa-check"></i>
    </div>

    <h1 class="auth-title auth-title-center">Password changed</h1>
    <p class="auth-sub auth-sub-center">Your password has been reset successfully. You can now sign in with your new password.</p>

    <a href="{% url 'accounts:login' %}" class="auth-btn">
      Sign In Now <i class="fas fa-arrow-right"></i>
    </a>
  </div>
</div>
{% endblock %}

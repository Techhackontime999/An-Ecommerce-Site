{% extends "shop/base/base.html" %}
{% load static %}

{% block title %}Email Verified — Shop-Seed{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-glow auth-glow-a"></div>
  <div class="auth-glow auth-glow-b"></div>
  <div class="auth-glow auth-glow-c"></div>

  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-logo"><i class="fas fa-store"></i></span>
      <span class="auth-brand-name">Shop-Seed</span>
    </div>

    <div class="auth-success-icon auth-success-icon-green">
      <i class="fas fa-check"></i>
    </div>

    <h1 class="auth-title auth-title-center">Email verified!</h1>
    <p class="auth-sub auth-sub-center">Your email address has been confirmed. One step left — verify your phone number.</p>

    <a href="{% url 'accounts:verify' %}" class="auth-btn">
      Continue <i class="fas fa-arrow-right"></i>
    </a>
  </div>
</div>
{% endblock %}
